# Supabase pauses free projects after a week with no activity. This touches the API twice a week.
name: Keep database awake

on:
  schedule:
    - cron: '17 15 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/units?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -o /dev/null -w "%{http_code}\n"
